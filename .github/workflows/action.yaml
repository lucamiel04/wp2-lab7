name: Backend CI Pipeline
 
# Exigence 4 : Déclencher uniquement sur la branche 'test'
on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - test
 
jobs:
  build-and-test:
    runs-on: ubuntu-latest
 
    steps:
      # 1. Récupérer le code source
      - name: Checkout repository
        uses: actions/checkout@v4
 
      # 2. Configurer Java (Assure-toi que la version correspond à ton projet, ici 17 par défaut)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
 
      # 3. Rendre le wrapper Gradle exécutable
      - name: Make gradlew executable
        run: chmod +x ./gradlew
 
      # 4. Exécuter les tests Backend (Exigence 1) avec la variable d'environnement (Exigence 2)
      - name: Run Backend Tests
        run: ./gradlew test
        env:
          MY_SECRET_KEY: ${{ secrets.MY_SECRET_KEY }}
 
      # 5. Générer le rapport de couverture JaCoCo (Exigence 3)
      - name: Generate JaCoCo Coverage Report
        run: ./gradlew jacocoTestReport
 
      # OPTIONNEL : Sauvegarder le rapport généré pour pouvoir le télécharger depuis GitHub
      - name: Upload JaCoCo Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: build/reports/jacoco/test/html/